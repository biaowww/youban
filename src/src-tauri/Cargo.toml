[package]
name = "youban"
version = "0.2.0"
description = "游伴 YouBan — 快速体验超长 3A 游戏"
authors = ["biao"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "youban_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
